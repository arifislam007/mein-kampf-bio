apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-java-app-deployment
  labels:
    app: my-java-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-java-app
  template:
    metadata:
      labels:
        app: my-java-app
    spec:
      containers:
      - name: my-java-app
        image: arifislam/my-java-app:27
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: my-java-app-service
  labels:
    app: my-java-app
spec:
  type: NodePort
  selector:
    app: my-java-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30007  # Specify a NodePort between 30000-32767, or let Kubernetes auto-assign one
